  <script>
    (() => {
      const articleListElement = document.querySelector("[data-article-list]");
      const searchEmptyElement = articleListElement?.querySelector("[data-search-empty]") || null;
      const searchFormElement = document.querySelector("[data-article-search]");
      const searchInputElement = searchFormElement?.querySelector("[data-search-input]") || null;
      const searchSubmitElement = searchFormElement?.querySelector("[data-search-submit]") || null;
      const searchResetElement = searchFormElement?.querySelector("[data-search-reset]") || null;
      const cardElements = Object.freeze(
        [...document.querySelectorAll("[data-article-card]")]
      );
      const cardIds = Object.freeze(
        cardElements
          .map((card) => card.dataset.articleId)
          .filter(Boolean)
      );
      const sidebarSectionKeys = Object.freeze([
        "recent-articles",
        "popular-articles",
        "taxonomy"
      ]);
      const sidebarSectionElements = Object.freeze(
        sidebarSectionKeys.map((key) => (
          document.querySelector(`[data-sidebar-section="${key}"]`)
        ))
      );
      const MAX_HOME_ARTICLES = 6;
      const MAX_RECENT_ARTICLES = 7;
      const formatJapaneseDate = (date) => {
        const [year, month, day] = String(date).split("-").map(Number);
        return year && month && day ? `${year}年${month}月${day}日` : String(date);
      };
      const dateValue = (date) => {
        const value = Date.parse(`${String(date || "")}T00:00:00Z`);
        return Number.isFinite(value) ? value : 0;
      };
      const compareArticlesByUpdatedDate = (left, right) => (
        dateValue(right.updatedDate) - dateValue(left.updatedDate)
        || String(left.articleId || "").localeCompare(String(right.articleId || ""))
      );
      const getSearchableArticles = (articles) => Object.freeze(
        articles
          .filter((article) => article.listOnHome !== false)
          .sort(compareArticlesByUpdatedDate)
      );
      const getLatestArticles = (articles) => Object.freeze(
        [...articles].slice(0, MAX_HOME_ARTICLES)
      );
      const createSidebarData = (sidebarConfig, articles) => {
        if (!sidebarConfig) {
          return null;
        }

        const recentArticles = articles
          .filter((article) => article.listOnHome !== false)
          .sort(compareArticlesByUpdatedDate)
          .slice(0, MAX_RECENT_ARTICLES)
          .map((article) => Object.freeze({
            articleId: article.articleId,
            thumbnail: article.image?.src || "",
            title: article.title,
            href: `article.html?id=${encodeURIComponent(article.articleId)}`
          }));

        return Object.freeze({
          ...sidebarConfig,
          recentArticles: Object.freeze(recentArticles)
        });
      };
      const findExistingCard = (articleId) => (
        cardElements.find((card) => card.dataset.articleId === articleId) || null
      );
      const createArticleCardFromData = (article) => {
        const matchingCard = findExistingCard(article.articleId);
        const templateCard = matchingCard || cardElements[0];
        const listingReactions = Array.isArray(article.reactions)
          ? article.reactions.slice(0, 8)
          : [];

        if (
          !templateCard
          || !article.description
          || !article.image?.src
          || !article.image?.alt
          || !article.image?.caption
          || listingReactions.length !== 8
          || listingReactions.some((reaction) => !reaction.name || !reaction.text)
        ) {
          return null;
        }

        const generatedCard = templateCard.cloneNode(true);
        const titleField = generatedCard.querySelector('[data-card-field="title"]');
        const titleLink = titleField?.querySelector("a");
        const taxonomyPills = generatedCard.querySelectorAll('[data-card-field="taxonomy"] .pill');
        const summaryText = generatedCard.querySelector('[data-card-field="summary"] p');
        const listingImage = generatedCard.querySelector('[data-card-field="image"] img');
        const listingCaption = generatedCard.querySelector('[data-card-field="image"] figcaption');
        const reactionContainer = generatedCard.querySelector('[data-card-field="reactions"]');
        const metaFields = generatedCard.querySelectorAll('[data-card-field="meta"] span');
        const continueLink = generatedCard.querySelector(".continue-link");
        const secondaryTag = article.tags.find(
          (tag) => tag !== article.category && tag !== "海外の反応"
        ) || article.tags[0] || "";
        const articleUrl = `article.html?id=${encodeURIComponent(article.articleId)}`;

        generatedCard.setAttribute("data-article-id", article.articleId);
        generatedCard.setAttribute("data-article-title", article.title);
        generatedCard.setAttribute("data-article-category", article.category);
        generatedCard.setAttribute("data-article-tags", article.tags.join("|"));
        generatedCard.setAttribute("data-published-date", article.publishedDate);
        generatedCard.setAttribute("data-updated-date", article.updatedDate);
        generatedCard.setAttribute(
          "data-has-video",
          String(article.contentBlocks?.some((block) => block.type === "video") || false)
        );
        generatedCard.setAttribute(
          "data-has-gif",
          String(article.contentBlocks?.some((block) => block.type === "gif") || false)
        );

        if (!matchingCard && titleField) {
          titleField.id = `article-card-title-${article.articleId}`;
          generatedCard.setAttribute("aria-labelledby", titleField.id);
        }
        if (titleLink) {
          titleLink.textContent = article.title;
          titleLink.setAttribute("href", articleUrl);
        }
        if (taxonomyPills[0]) {
          taxonomyPills[0].textContent = article.category;
        }
        if (taxonomyPills[1]) {
          taxonomyPills[1].textContent = secondaryTag;
        }
        if (summaryText) {
          summaryText.textContent = article.description;
        }
        if (listingImage) {
          listingImage.setAttribute("src", article.image.src);
          listingImage.setAttribute("alt", article.image.alt);
        }
        if (listingCaption) {
          listingCaption.textContent = article.image.caption;
        }
        if (reactionContainer) {
          const reactionElements = listingReactions.map((reactionData) => {
            const reaction = document.createElement("p");
            const reactionMeta = document.createElement("span");

            reaction.className = "reaction";
            reactionMeta.className = "reaction__meta";
            reactionMeta.textContent = reactionData.name;
            reaction.append(reactionMeta, document.createTextNode(reactionData.text));
            return reaction;
          });
          reactionContainer.replaceChildren(...reactionElements);
        }
        if (continueLink) {
          continueLink.setAttribute("href", `${articleUrl}#reaction-9`);
        }
        if (metaFields[0]) {
          metaFields[0].textContent = `公開日：${formatJapaneseDate(article.publishedDate)}`;
        }
        if (metaFields[1]) {
          metaFields[1].textContent = `更新日：${formatJapaneseDate(article.updatedDate)}`;
        }
        if (metaFields[2]) {
          metaFields[2].textContent = `タグ：${article.tags.join("／")}`;
        }

        generatedCard.hidden = false;
        return generatedCard;
      };
      const normalizeSearchText = (value) => String(value ?? "").trim().toLocaleLowerCase();
      const collectSearchStrings = (value, strings = []) => {
        if (typeof value === "string" || typeof value === "number") {
          strings.push(String(value));
        } else if (Array.isArray(value)) {
          value.forEach((item) => collectSearchStrings(item, strings));
        } else if (value && typeof value === "object") {
          Object.values(value).forEach((item) => collectSearchStrings(item, strings));
        }
        return strings;
      };
      const createArticleSearchText = (article) => normalizeSearchText([
        article.articleId,
        article.title,
        ...collectSearchStrings(article.reactions),
        article.category,
        ...(Array.isArray(article.tags) ? article.tags : []),
        article.description,
        article.image?.alt,
        article.image?.caption,
        ...collectSearchStrings(article.contentBlocks)
      ].join("\n"));
      const findSearchMatches = (articles, query) => {
        const normalizedQuery = normalizeSearchText(query);
        return normalizedQuery
          ? articles.filter((article) => createArticleSearchText(article).includes(normalizedQuery))
          : [...articles];
      };
      const renderArticleSelection = (articles) => {
        if (!articleListElement) {
          return false;
        }

        const generatedCards = articles.map((article) => createArticleCardFromData(article));
        if (generatedCards.some((card) => !card)) {
          return false;
        }

        articleListElement.querySelectorAll("[data-article-card]").forEach((card) => card.remove());
        generatedCards.forEach((card) => {
          articleListElement.insertBefore(card, searchEmptyElement);
        });
        if (searchEmptyElement) {
          searchEmptyElement.hidden = generatedCards.length > 0;
        }
        activeCardReplacements = [];
        return true;
      };
      const compareArticleCard = (article) => {
        const existingCard = findExistingCard(article.articleId);
        const generatedCard = createArticleCardFromData(article);
        const referenceCard = existingCard || cardElements[0];

        if (!referenceCard || !generatedCard) {
          return Object.freeze({
            articleId: article.articleId,
            comparable: false,
            htmlMatches: false,
            structureMatches: false,
            commentCountMatches: false,
            linkTargetsMatch: false
          });
        }

        const structureSelectors = [
          ".article-card__inner",
          '[data-card-field="taxonomy"]',
          '[data-card-field="title"]',
          '[data-card-field="summary"]',
          '[data-card-field="image"]',
          '[data-card-field="reactions"]',
          '[data-card-field="article-link"]',
          '[data-card-field="meta"]'
        ];
        const existingLinks = existingCard
          ? [...existingCard.querySelectorAll("a")]
            .map((link) => link.getAttribute("href"))
          : [];
        const generatedLinks = [...generatedCard.querySelectorAll("a")]
          .map((link) => link.getAttribute("href"));
        const existingTitle = existingCard?.querySelector('[data-card-field="title"] a')?.textContent || "";
        const generatedTitle = generatedCard.querySelector('[data-card-field="title"] a')?.textContent || "";
        const existingImage = existingCard?.querySelector('[data-card-field="image"] img')?.getAttribute("src") || null;
        const generatedImage = generatedCard.querySelector('[data-card-field="image"] img')?.getAttribute("src") || null;
        const existingCommentCount = existingCard?.querySelectorAll(".reaction").length || 0;
        const generatedCommentCount = generatedCard.querySelectorAll(".reaction").length;
        const articleUrl = `article.html?id=${encodeURIComponent(article.articleId)}`;
        const expectedLinks = [articleUrl, `${articleUrl}#reaction-9`];
        const generatedReactions = [...generatedCard.querySelectorAll(".reaction")].map((reaction) => ({
          name: reaction.querySelector(".reaction__meta")?.textContent || "",
          text: reaction.textContent.slice(
            reaction.querySelector(".reaction__meta")?.textContent.length || 0
          )
        }));
        const generatedMeta = [...generatedCard.querySelectorAll('[data-card-field="meta"] span')]
          .map((item) => item.textContent);
        const titleMatches = existingCard
          ? existingTitle === generatedTitle
          : generatedTitle === article.title;
        const imageMatches = existingCard
          ? existingImage === generatedImage
          : generatedImage === article.image.src;
        const listingReactions = article.reactions.slice(0, 8);
        const commentCountMatches = generatedCommentCount === listingReactions.length;
        const linkTargetsMatch = existingCard
          ? existingLinks.join("\n") === generatedLinks.join("\n")
          : expectedLinks.join("\n") === generatedLinks.join("\n");
        const structureMatches = structureSelectors.every(
          (selector) => referenceCard.querySelectorAll(selector).length
            === generatedCard.querySelectorAll(selector).length
        );
        const summaryMatches = generatedCard.querySelector('[data-card-field="summary"] p')
          ?.textContent === article.description;
        const commentsContentMatches = JSON.stringify(generatedReactions)
          === JSON.stringify(listingReactions.map(({ name, text }) => ({ name, text })));
        const taxonomyMatches = generatedCard.querySelector(
          '[data-card-field="taxonomy"] .pill'
        )?.textContent === article.category;
        const metaMatches = generatedMeta.join("\n") === [
          `公開日：${formatJapaneseDate(article.publishedDate)}`,
          `更新日：${formatJapaneseDate(article.updatedDate)}`,
          `タグ：${article.tags.join("／")}`
        ].join("\n");

        return Object.freeze({
          articleId: article.articleId,
          isNew: !existingCard,
          comparable: true,
          htmlMatches: existingCard ? existingCard.outerHTML === generatedCard.outerHTML : null,
          structureMatches,
          titleMatches,
          imageMatches,
          commentCountMatches,
          linkTargetsMatch,
          summaryMatches,
          commentsContentMatches,
          taxonomyMatches,
          metaMatches,
          allComparedFieldsMatch: titleMatches
            && imageMatches
            && commentCountMatches
            && linkTargetsMatch
            && structureMatches
            && summaryMatches
            && commentsContentMatches
            && taxonomyMatches
            && metaMatches,
          existingTitle,
          generatedTitle,
          existingImage,
          generatedImage,
          existingCommentCount,
          generatedCommentCount,
          existingLinks: Object.freeze(existingLinks),
          generatedLinks: Object.freeze(generatedLinks)
        });
      };
      const resolveArticleHref = (articleId, availableArticleIds, fallbackHref = null) => (
        articleId && availableArticleIds.has(articleId)
          ? `article.html?id=${encodeURIComponent(articleId)}`
          : fallbackHref
      );
      const createSidebarSectionsFromData = (sidebarData, availableArticleIds) => {
        if (
          !sidebarData
          || !Array.isArray(sidebarData.recentArticles)
          || !Array.isArray(sidebarData.popularArticles)
          || !Array.isArray(sidebarData.taxonomy?.categories)
          || !Array.isArray(sidebarData.taxonomy?.playerGroups)
          || sidebarSectionElements.some((section) => !section)
        ) {
          return null;
        }

        const generatedSections = sidebarSectionElements.map((section) => section.cloneNode(true));
        const recentSection = generatedSections[0];
        const popularSection = generatedSections[1];
        const taxonomySection = generatedSections[2];
        const recentList = recentSection.querySelector('[data-sidebar-list="recent-articles"]');
        const recentItemTemplate = recentList?.querySelector("[data-sidebar-item]") || null;
        const recentItems = recentItemTemplate
          ? sidebarData.recentArticles.map(() => recentItemTemplate.cloneNode(true))
          : [];
        recentList?.replaceChildren(...recentItems);
        const popularItems = [...popularSection.querySelectorAll("[data-sidebar-item]")];
        const categoryItems = [...taxonomySection.querySelectorAll(
          '[data-taxonomy-item][data-taxonomy-type="category"]'
        )];
        const playerGroups = [...taxonomySection.querySelectorAll("[data-kana-group]")];

        if (
          !recentList
          || !recentItemTemplate
          || recentItems.length !== sidebarData.recentArticles.length
          || popularItems.length !== sidebarData.popularArticles.length
          || categoryItems.length !== sidebarData.taxonomy.categories.length
          || playerGroups.length !== sidebarData.taxonomy.playerGroups.length
        ) {
          return null;
        }

        recentItems.forEach((item, index) => {
          const data = sidebarData.recentArticles[index];
          const link = item.querySelector("[data-sidebar-link]");
          const thumbnail = item.querySelector('[data-sidebar-field="thumbnail"]');
          const title = item.querySelector('[data-sidebar-field="title"]');
          const href = resolveArticleHref(
            data.articleId,
            availableArticleIds,
            data.href || link?.getAttribute("href") || null
          );

          if (data.articleId) {
            item.setAttribute("data-article-id", data.articleId);
          } else {
            item.removeAttribute("data-article-id");
          }
          if (link && href) {
            link.setAttribute("href", href);
          }
          thumbnail?.setAttribute("src", data.thumbnail);
          if (title) {
            title.textContent = data.title;
          }
        });

        popularItems.forEach((item, index) => {
          const data = sidebarData.popularArticles[index];
          const href = resolveArticleHref(data.articleId, availableArticleIds);
          const existingLink = item.querySelector("[data-sidebar-link]");

          if (data.articleId) {
            item.setAttribute("data-article-id", data.articleId);
          } else {
            item.removeAttribute("data-article-id");
          }
          item.setAttribute("data-rank", String(data.rank));
          if (href) {
            const link = existingLink || document.createElement("a");
            link.setAttribute("data-sidebar-link", "");
            link.setAttribute("href", href);
            link.setAttribute("style", "color: inherit; text-decoration: none;");
            link.textContent = data.title;
            item.replaceChildren(link);
          } else {
            item.textContent = data.title;
          }
        });

        categoryItems.forEach((item, index) => {
          const data = sidebarData.taxonomy.categories[index];
          item.setAttribute("data-taxonomy-id", data.taxonomyId);
          const label = item.querySelector('[data-taxonomy-field="label"]');
          const count = item.querySelector('[data-taxonomy-field="count"]');

          if (label) {
            label.textContent = data.label;
          }
          if (count) {
            count.textContent = String(data.count);
          }
        });

        playerGroups.forEach((group, groupIndex) => {
          const data = sidebarData.taxonomy.playerGroups[groupIndex];
          const label = group.querySelector('[data-sidebar-field="group-label"]');
          const playerItems = [...group.querySelectorAll(
            '[data-taxonomy-item][data-taxonomy-type="player"]'
          )];

          if (playerItems.length !== data.players.length) {
            throw new Error(`Sidebar player count mismatch: ${data.kana}`);
          }

          group.setAttribute("data-kana-group", data.kana);
          group.setAttribute("data-expanded", String(data.expanded));
          if (label) {
            label.textContent = data.label;
          }
          playerItems.forEach((item, playerIndex) => {
            const player = data.players[playerIndex];
            const playerLabel = item.querySelector('[data-taxonomy-field="label"]');
            const playerCount = item.querySelector('[data-taxonomy-field="count"]');

            item.setAttribute("data-taxonomy-id", player.taxonomyId);
            if (playerLabel) {
              playerLabel.textContent = player.label;
            }
            if (playerCount) {
              playerCount.textContent = String(player.count);
            }
          });
        });

        return Object.freeze(generatedSections);
      };
      const compareSidebarSections = (sidebarData, availableArticleIds) => {
        const generatedSections = createSidebarSectionsFromData(sidebarData, availableArticleIds);

        if (!generatedSections) {
          return Object.freeze([]);
        }

        return Object.freeze(generatedSections.map((generatedSection, index) => {
          const originalSection = sidebarSectionElements[index];
          const existingLinks = [...originalSection.querySelectorAll("a")]
            .map((link) => link.getAttribute("href"));
          const generatedLinks = [...generatedSection.querySelectorAll("a")]
            .map((link) => link.getAttribute("href"));

          return Object.freeze({
            key: sidebarSectionKeys[index],
            htmlMatches: originalSection.outerHTML === generatedSection.outerHTML,
            linksMatch: existingLinks.join("\n") === generatedLinks.join("\n"),
            existingLinks: Object.freeze(existingLinks),
            generatedLinks: Object.freeze(generatedLinks)
          });
        }));
      };
      let activeSidebarReplacements = [];
      const measureSidebarSection = (section) => {
        const rect = section.getBoundingClientRect();
        return Object.freeze({ width: rect.width, height: rect.height });
      };
      const rollbackSidebarReplacements = () => {
        [...activeSidebarReplacements].reverse().forEach((replacement) => {
          if (replacement.generatedSection.isConnected) {
            replacement.generatedSection.replaceWith(replacement.originalSection);
          }
        });
        const restored = activeSidebarReplacements.length > 0;
        activeSidebarReplacements = [];
        return restored;
      };
      const replaceSidebarSectionsForTest = (sidebarData, availableArticleIds) => {
        const generatedSections = createSidebarSectionsFromData(sidebarData, availableArticleIds);

        if (!generatedSections) {
          return Object.freeze({
            replaced: false,
            rolledBack: false,
            reason: "generation-failed",
            sectionResults: Object.freeze([])
          });
        }

        activeSidebarReplacements = [];
        const sectionResults = generatedSections.map((generatedSection, index) => {
          const originalSection = sidebarSectionElements[index];

          originalSection.replaceWith(generatedSection);
          activeSidebarReplacements.push({ originalSection, generatedSection });

          return Object.freeze({
            key: sidebarSectionKeys[index],
            rendered: true
          });
        });

        return Object.freeze({
          replaced: true,
          rolledBack: false,
          reason: "replacement-complete",
          sectionResults: Object.freeze(sectionResults)
        });
      };
      let activeCardReplacements = [];
      const measureCardLayout = (card) => {
        const cardRect = card.getBoundingClientRect();
        const continueRect = card.querySelector(".continue-link")?.getBoundingClientRect();

        return Object.freeze({
          width: cardRect.width,
          height: cardRect.height,
          continueTop: continueRect ? continueRect.top - cardRect.top : null,
          continueLeft: continueRect ? continueRect.left - cardRect.left : null
        });
      };
      const cardLayoutsMatch = (beforeLayout, afterLayout) => (
        Math.abs(beforeLayout.width - afterLayout.width) < 0.5
        && Math.abs(beforeLayout.height - afterLayout.height) < 0.5
        && (
          beforeLayout.continueTop === null
          ? afterLayout.continueTop === null
          : Math.abs(beforeLayout.continueTop - afterLayout.continueTop) < 0.5
        )
        && (
          beforeLayout.continueLeft === null
          ? afterLayout.continueLeft === null
          : Math.abs(beforeLayout.continueLeft - afterLayout.continueLeft) < 0.5
        )
      );
      const rollbackActiveCardReplacements = () => {
        if (activeCardReplacements.length === 0) {
          return false;
        }

        [...activeCardReplacements].reverse().forEach((replacement) => {
          const { originalCard, generatedCard, parent, nextSibling, inserted } = replacement;

          if (inserted) {
            if (generatedCard.isConnected) {
              generatedCard.parentNode.removeChild(generatedCard);
            }
          } else if (generatedCard.isConnected) {
            generatedCard.replaceWith(originalCard);
          } else if (!originalCard.isConnected) {
            parent.insertBefore(originalCard, nextSibling);
          }
        });

        activeCardReplacements = [];
        return true;
      };
      const replaceAllCardsForTest = (articles) => {
        const articlesById = new Map(
          articles.map((article) => [article.articleId, article])
        );
        const plannedArticles = cardIds.map((articleId) => articlesById.get(articleId));
        const newArticles = articles.filter((article) => !cardIds.includes(article.articleId));
        const preReplacementComparisons = articles.map((article) => compareArticleCard(article));

        if (
          !articleListElement
          || plannedArticles.some((article) => !article)
          || preReplacementComparisons.some((comparison) => (
            !comparison.comparable
            || !comparison.allComparedFieldsMatch
          ))
        ) {
          return Object.freeze({
            replaced: false,
            rolledBack: false,
            reason: "pre-replacement-comparison-failed",
            cardResults: Object.freeze(preReplacementComparisons)
          });
        }

        const cardResults = [];
        activeCardReplacements = [];

        for (const article of plannedArticles) {
          const originalCard = findExistingCard(article.articleId);
          const generatedCard = createArticleCardFromData(article);
          const comparison = compareArticleCard(article);
          const beforeHtml = originalCard.outerHTML;
          const beforeLayout = measureCardLayout(originalCard);
          const parent = originalCard.parentNode;
          const nextSibling = originalCard.nextSibling;

          originalCard.replaceWith(generatedCard);
          activeCardReplacements.push({
            originalCard,
            generatedCard,
            parent,
            nextSibling
          });

          const afterLayout = measureCardLayout(generatedCard);
          cardResults.push(Object.freeze({
            articleId: article.articleId,
            isNew: false,
            htmlMatches: beforeHtml === generatedCard.outerHTML,
            structureMatches: comparison.structureMatches,
            layoutMatches: cardLayoutsMatch(beforeLayout, afterLayout),
            commentCount: generatedCard.querySelectorAll(".reaction").length,
            imageSrc: generatedCard.querySelector('[data-card-field="image"] img')?.getAttribute("src") || null,
            title: generatedCard.querySelector('[data-card-field="title"] a')?.textContent || "",
            category: generatedCard.querySelector('[data-card-field="taxonomy"] .pill')?.textContent || "",
            continueHref: generatedCard.querySelector(".continue-link")?.getAttribute("href") || null,
            beforeHtml,
            afterHtml: generatedCard.outerHTML,
            beforeLayout,
            afterLayout,
            comparison
          }));
        }

        for (const article of newArticles) {
          const generatedCard = createArticleCardFromData(article);
          const comparison = compareArticleCard(article);
          const referenceCard = articleListElement.querySelector("[data-article-card]");
          const beforeLayout = measureCardLayout(referenceCard);

          articleListElement.append(generatedCard);
          activeCardReplacements.push({
            originalCard: null,
            generatedCard,
            parent: articleListElement,
            nextSibling: null,
            inserted: true
          });

          const afterLayout = measureCardLayout(generatedCard);
          cardResults.push(Object.freeze({
            articleId: article.articleId,
            isNew: true,
            htmlMatches: null,
            structureMatches: comparison.structureMatches,
            layoutMatches: cardLayoutsMatch(beforeLayout, afterLayout),
            commentCount: generatedCard.querySelectorAll(".reaction").length,
            imageSrc: generatedCard.querySelector('[data-card-field="image"] img')?.getAttribute("src") || null,
            title: generatedCard.querySelector('[data-card-field="title"] a')?.textContent || "",
            category: generatedCard.querySelector('[data-card-field="taxonomy"] .pill')?.textContent || "",
            continueHref: generatedCard.querySelector(".continue-link")?.getAttribute("href") || null,
            beforeHtml: referenceCard.outerHTML,
            afterHtml: generatedCard.outerHTML,
            beforeLayout,
            afterLayout,
            comparison
          }));
        }

        const allCardsMatch = cardResults.every(
          (result) => result.structureMatches
            && result.commentCount === 8
            && result.continueHref === `article.html?id=${result.articleId}#reaction-9`
        );

        if (!allCardsMatch) {
          rollbackActiveCardReplacements();
          return Object.freeze({
            replaced: false,
            rolledBack: true,
            reason: "automatic-rollback-after-mismatch",
            cardResults: Object.freeze(cardResults)
          });
        }

        return Object.freeze({
          replaced: true,
          rolledBack: false,
          reason: "replacement-complete",
          cardResults: Object.freeze(cardResults)
        });
      };
      const articleListContext = {
        loadStatus: "loading",
        loadError: null,
        comparisonStatus: "not-run",
        comparisonError: null,
        allArticles: Object.freeze([]),
        articles: Object.freeze([]),
        latestArticles: Object.freeze([]),
        cardIds,
        cardMatches: Object.freeze([]),
        generatedCards: Object.freeze([]),
        cardComparisons: Object.freeze([]),
        replacementStatus: "not-run",
        replacementError: null,
        replacementResult: null,
        sidebarData: null,
        sidebarComparisonStatus: "not-run",
        sidebarComparisons: Object.freeze([]),
        sidebarReplacementStatus: "not-run",
        sidebarReplacementError: null,
        sidebarReplacementResult: null,
        searchStatus: "waiting",
        searchQuery: "",
        searchResultIds: Object.freeze([]),
        missingArticleIds: Object.freeze([...cardIds]),
        unmatchedArticleIds: Object.freeze([]),
        ready: null,
        get allCardsMatched() {
          return this.loadStatus === "loaded"
            && this.missingArticleIds.length === 0
            && this.comparisonStatus === "matched";
        },
        getArticleById(articleId) {
          return this.articles.find((article) => article.articleId === articleId) || null;
        },
        createArticleCard(articleOrId) {
          const article = typeof articleOrId === "string"
            ? this.getArticleById(articleOrId)
            : articleOrId;
          return article ? createArticleCardFromData(article) : null;
        },
        compareArticleCard(articleOrId) {
          const article = typeof articleOrId === "string"
            ? this.getArticleById(articleOrId)
            : articleOrId;
          return article ? compareArticleCard(article) : null;
        },
        rollbackArticleCardReplacements() {
          const restored = rollbackActiveCardReplacements();
          if (restored) {
            this.replacementStatus = "rolled-back";
          }
          return restored;
        },
        rollbackFirstCardReplacement() {
          return this.rollbackArticleCardReplacements();
        },
        rollbackSidebarReplacement() {
          const restored = rollbackSidebarReplacements();
          if (restored) {
            this.sidebarReplacementStatus = "rolled-back";
          }
          return restored;
        },
        search(query) {
          return applyArticleSearch(query);
        },
        clearSearch() {
          return clearArticleSearch();
        }
      };

      window.FOOT_VOX = window.FOOT_VOX || {};
      window.FOOT_VOX.articleListContext = articleListContext;

      const setSearchControlsActive = (active) => {
        if (searchSubmitElement) {
          searchSubmitElement.hidden = active;
        }
        if (searchResetElement) {
          searchResetElement.hidden = !active;
        }
      };
      const applyArticleSearch = (query = searchInputElement?.value || "") => {
        if (articleListContext.loadStatus !== "loaded") {
          articleListContext.searchStatus = articleListContext.loadStatus === "failed"
            ? "fallback"
            : "waiting";
          return Object.freeze([]);
        }

        const normalizedQuery = normalizeSearchText(query);
        const matches = normalizedQuery
          ? findSearchMatches(articleListContext.articles, normalizedQuery)
          : [...articleListContext.latestArticles];
        const rendered = renderArticleSelection(matches);

        if (!rendered) {
          articleListContext.searchStatus = "render-failed";
          return Object.freeze([]);
        }

        articleListContext.searchQuery = normalizedQuery;
        articleListContext.searchResultIds = Object.freeze(
          matches.map((article) => article.articleId)
        );
        articleListContext.searchStatus = normalizedQuery
          ? (matches.length > 0 ? "matched" : "empty")
          : "cleared";
        setSearchControlsActive(Boolean(normalizedQuery));
        return Object.freeze([...matches]);
      };
      const clearArticleSearch = () => {
        if (searchInputElement) {
          searchInputElement.value = "";
        }
        const matches = applyArticleSearch("");
        searchInputElement?.focus();
        return matches;
      };
      const runSearchWhenReady = () => {
        const query = searchInputElement?.value || "";
        return articleListContext.ready.then(() => applyArticleSearch(query));
      };
      const activateKeyboardButton = (event, action) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          action();
        }
      };

      articleListContext.ready = fetch("data/articles.json")
        .then((response) => {
          if (!response.ok) {
            throw new Error(`Article list request failed: ${response.status}`);
          }
          return response.json();
        })
        .then((payload) => {
          const articles = payload.articles;
          const frozenArticles = Object.freeze(
            articles.map((article) => Object.freeze({ ...article }))
          );
          const searchableArticles = getSearchableArticles([...frozenArticles]);
          const listArticles = getLatestArticles(searchableArticles);
          const availableArticleIds = new Set(
            frozenArticles.map((article) => article.articleId).filter(Boolean)
          );
          const articleIds = new Set(listArticles.map((article) => article.articleId));
          const cardIdSet = new Set(cardIds);
          const sidebarData = createSidebarData(payload.homeSidebar || null, [...frozenArticles]);
          articleListContext.allArticles = frozenArticles;
          articleListContext.articles = searchableArticles;
          articleListContext.latestArticles = listArticles;
          articleListContext.sidebarData = sidebarData;
          articleListContext.cardMatches = Object.freeze(
            cardIds.map((articleId) => Object.freeze({
              articleId,
              matched: articleIds.has(articleId)
            }))
          );
          articleListContext.generatedCards = Object.freeze(
            listArticles
              .map((article) => createArticleCardFromData(article))
              .filter(Boolean)
          );
          articleListContext.cardComparisons = Object.freeze(
            listArticles.map((article) => compareArticleCard(article))
          );
          articleListContext.missingArticleIds = Object.freeze(
            cardIds.filter((articleId) => !articleIds.has(articleId))
          );
          articleListContext.unmatchedArticleIds = Object.freeze(
            listArticles
              .map((article) => article.articleId)
              .filter((articleId) => !cardIdSet.has(articleId))
          );
          articleListContext.loadStatus = "loaded";
          const allComparisonsMatch = articleListContext.cardComparisons.length === listArticles.length
            && articleListContext.cardComparisons.every(
              (comparison) => comparison.comparable && comparison.allComparedFieldsMatch
            )
            && articleListContext.missingArticleIds.length === 0;

          articleListContext.comparisonStatus = allComparisonsMatch ? "matched" : "mismatch";

          try {
            articleListContext.replacementResult = replaceAllCardsForTest(listArticles);
            articleListContext.replacementStatus = articleListContext.replacementResult.replaced
              ? "replaced"
              : articleListContext.replacementResult.reason;
          } catch (error) {
            rollbackActiveCardReplacements();
            articleListContext.replacementStatus = "failed";
            articleListContext.replacementError = error instanceof Error ? error.message : String(error);
          }

          try {
            articleListContext.sidebarComparisons = compareSidebarSections(
              sidebarData,
              availableArticleIds
            );
            const sidebarComparisonsMatch = articleListContext.sidebarComparisons.length
              === sidebarSectionKeys.length
              && articleListContext.sidebarComparisons.every(
                (comparison) => comparison.htmlMatches && comparison.linksMatch
              );

            articleListContext.sidebarComparisonStatus = sidebarComparisonsMatch
              ? "matched"
              : "mismatch";
            articleListContext.sidebarReplacementResult = replaceSidebarSectionsForTest(
              sidebarData,
              availableArticleIds
            );
            articleListContext.sidebarReplacementStatus =
              articleListContext.sidebarReplacementResult.replaced
                ? "replaced"
                : articleListContext.sidebarReplacementResult.reason;
          } catch (error) {
            rollbackSidebarReplacements();
            articleListContext.sidebarComparisonStatus = "failed";
            articleListContext.sidebarReplacementStatus = "failed";
            articleListContext.sidebarReplacementError =
              error instanceof Error ? error.message : String(error);
          }

          return articleListContext;
        })
        .catch((error) => {
          articleListContext.loadStatus = "failed";
          articleListContext.loadError = error instanceof Error ? error.message : String(error);
          articleListContext.comparisonStatus = "failed";
          articleListContext.comparisonError = articleListContext.loadError;
          articleListContext.replacementStatus = "not-run";
          articleListContext.sidebarComparisonStatus = "failed";
          articleListContext.sidebarReplacementStatus = "not-run";
          articleListContext.sidebarReplacementError = articleListContext.loadError;
          articleListContext.searchStatus = "fallback";
          return articleListContext;
        });

      searchFormElement?.addEventListener("submit", (event) => {
        event.preventDefault();
        runSearchWhenReady();
      });
      searchInputElement?.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          runSearchWhenReady();
        }
      });
      searchSubmitElement?.addEventListener("click", runSearchWhenReady);
      searchSubmitElement?.addEventListener("keydown", (event) => {
        activateKeyboardButton(event, runSearchWhenReady);
      });
      searchResetElement?.addEventListener("click", clearArticleSearch);
      searchResetElement?.addEventListener("keydown", (event) => {
        activateKeyboardButton(event, clearArticleSearch);
      });

      Object.seal(articleListContext);
    })();
  </script>
</body>
</html>
