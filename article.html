<body id="page-top">
  <!-- PROTOTYPE: Editorial direction selected for design refinement. -->
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-logo" href="index.html">
        FOOT VOX

  <main class="site-grid">
    <section class="main-column" aria-label="記事本文">
      <!-- Future ad code may be inserted into this container. -->
      <div class="ad-slot" data-ad-slot="main-top"></div>

      <h1 class="page-heading"><span>Latest dispatches</span>海外サッカー 最新の反応</h1>

      <article id="article-top" class="article-detail" data-article-detail aria-labelledby="article-title">
        <div class="article-detail__inner">
        <nav class="breadcrumbs" aria-label="パンくず"><a href="index.html">トップ</a> ／ <span data-breadcrumb-category></span> ／ <span data-breadcrumb-tag></span></nav>

        <div class="eyebrow">
          <span class="pill" data-article-category></span>
          <span class="pill pill--muted" data-article-secondary-tag></span>
        </div>

        <h1 id="article-title" class="article-title"></h1>
        <div class="updated-mark">Updated — 追記あり</div>

        <!-- Reorder complete data-content-block elements to compose each article body. GIF uses the same media markup as image. -->
        <div class="article-content-blocks" data-article-blocks data-supported-block-types="text image video gif">
          <div class="article-content-block" data-content-block data-block-type="text" data-text-role="summary">
            <div class="summary-box">
              <p data-summary-existing></p>
              <p data-summary-preview data-render-status="waiting" hidden aria-hidden="true"></p>
            </div>
          </div>

          <div class="article-content-block" data-content-block data-block-type="image">
            <figure class="media-block">
              <img data-article-image width="1200" height="675" alt="">
              <figcaption data-article-image-caption></figcaption>
            </figure>
          </div>

          <div class="article-content-block" data-content-block data-block-type="text" data-text-role="source">
            <p class="source-link">原文：<a href="" rel="noopener noreferrer"></a></p>
          </div>

          <!-- Future inline ad code may be inserted into this container. -->
          <div class="ad-slot" data-ad-slot="article-inline"></div>

          <div class="article-content-block" data-content-block data-block-type="video">
            <figure class="media-block media-block--embed" data-video-media data-embed-provider="">
              <!-- Replace the placeholder with a YouTube iframe or an X video embed. -->
              <div class="media-embed" data-embed-container>
                <div class="video-placeholder" data-embed-placeholder role="img" aria-label="動画が未設定の状態">
                  <span><strong>▶</strong>VIDEO PLACEHOLDER — 560px</span>
                </div>
              </div>
            </figure>
          </div>

          <div class="article-content-block" data-content-block data-block-type="text" data-text-role="reactions-start">
            <h2 class="section-title">海外の反応</h2>
          </div>

          <div class="article-content-block" data-content-block data-block-type="gif" hidden>
            <figure class="media-block" data-gif-media>
              <!-- Set src and alt, then remove hidden from the gif block. -->
              <img data-gif-source width="1200" height="675" loading="lazy" decoding="async" alt="">
              <figcaption data-media-caption hidden></figcaption>
            </figure>
          </div>

          <div class="article-content-block" data-content-block data-block-type="text" data-text-role="reactions-end">
            <div class="reactions reactions--continued" aria-label="海外の反応 続き">
            </div>
          </div>
        </div>

        <div class="article-end">
          <h2 class="section-title">関連記事</h2>
          <ul class="related-list"></ul>

          <div class="share-row" aria-label="共有コントロールの外観例">
            <span class="static-control">𝕏 で共有</span>
            <span class="static-control">リンクをコピー</span>
            <span class="static-control static-control--success">コピーしました</span>
          </div>

          <div class="article-meta">
            <span data-article-published-date></span>
            <span data-article-updated-date></span>
            <span data-article-tags></span>
          </div>

          <div class="to-top"><a href="#page-top">ページ上部へ戻る ↑</a></div>
        </div>

        </div>
      </article>
    </section>

    <aside class="sidebar" data-sidebar aria-label="サイドバー">
      <section class="side-section" data-sidebar-section="recent-articles">
        <h2 class="side-section__heading">最近の記事</h2>
        <div class="side-section__body">

            <li data-sidebar-item><a href="" data-sidebar-link><img alt="" data-sidebar-field="thumbnail"><span data-sidebar-field="title"></span></a></li>

            <li data-sidebar-item><a href="" data-sidebar-link><img alt="" data-sidebar-field="thumbnail"><span data-sidebar-field="title"></span></a></li>
            <li data-sidebar-item><a href="" data-sidebar-link><img alt="" data-sidebar-field="thumbnail"><span data-sidebar-field="title"></span></a></li>

        </div>

      <section class="side-section" data-sidebar-section="popular-articles">

          <div class="tabs" aria-label="人気記事タブの状態例">
            <span class="tab tab--selected">24時間</span>
            <span class="tab">7日間</span>
          </div>
          <ol class="popular-list" data-sidebar-list="popular-articles">
            <li data-sidebar-item><a href="" data-sidebar-link style="color: inherit; text-decoration: none;"></a></li>
            <li data-sidebar-item><a href="" data-sidebar-link style="color: inherit; text-decoration: none;"></a></li>
            <li data-sidebar-item><a href="" data-sidebar-link style="color: inherit; text-decoration: none;"></a></li>
            <li data-sidebar-item><a href="" data-sidebar-link style="color: inherit; text-decoration: none;"></a></li>
            <li data-sidebar-item><a href="" data-sidebar-link style="color: inherit; text-decoration: none;"></a></li>
          </ol>
        </div>
      </section>

      <section class="side-section">
        <h2 class="side-section__heading">記事を検索</h2>
        <div class="side-section__body">
          <div class="search-form" aria-label="検索フォームの外観例">
            <input type="search" placeholder="選手名・クラブ名" aria-label="検索キーワード">
            <span aria-hidden="true">検索</span>
          </div>

      <section class="side-section" data-sidebar-section="taxonomy">
        <h2 class="side-section__heading">カテゴリー・選手</h2>
        <div class="side-section__body">
          <ul class="category-list" data-taxonomy-list="categories">
            <li data-taxonomy-item data-taxonomy-type="category"><span data-taxonomy-field="label"></span><b data-taxonomy-field="count"></b></li>
            <li data-taxonomy-item data-taxonomy-type="category"><span data-taxonomy-field="label"></span><b data-taxonomy-field="count"></b></li>
            <li data-taxonomy-item data-taxonomy-type="category"><span data-taxonomy-field="label"></span><b data-taxonomy-field="count"></b></li>
            <li data-taxonomy-item data-taxonomy-type="category"><span data-taxonomy-field="label"></span><b data-taxonomy-field="count"></b></li>
            <li data-taxonomy-item data-taxonomy-type="category"><span data-taxonomy-field="label"></span><b data-taxonomy-field="count"></b></li>
            <li data-taxonomy-item data-taxonomy-type="category"><span data-taxonomy-field="label"></span><b data-taxonomy-field="count"></b></li>
          </ul>
          <div class="kana-group" data-kana-group data-expanded="false">

              <li data-taxonomy-item data-taxonomy-type="player"><span data-taxonomy-field="label"></span><b data-taxonomy-field="count"></b></li>
              <li data-taxonomy-item data-taxonomy-type="player"><span data-taxonomy-field="label"></span><b data-taxonomy-field="count"></b></li>
            </ul>
          </div>
          <div class="kana-group" data-kana-group data-expanded="false">
            <div class="kana-group__label" data-sidebar-field="group-label"></div>
          </div>
          <div class="kana-group" data-kana-group data-expanded="false">
            <div class="kana-group__label" data-sidebar-field="group-label"></div>
          </div>
        </div>
      </section>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <div class="footer-brand">FOOT VOX<small>Football voices from around the world.</small></div>
      <div class="footer-links" aria-label="フッターナビゲーションの外観例">
        <span>このサイトについて</span>
        <span>プライバシーポリシー</span>

        <span>お問い合わせ</span>
        <span>RSS</span>
      </div>
    </div>
  </footer>

  <script>
    (() => {
      const detail = document.querySelector("[data-article-detail]");
      const title = document.querySelector("#article-title");
      const metaDescription = document.querySelector('meta[name="description"]');
      const metaRobots = document.querySelector('meta[name="robots"]');
      const canonical = document.querySelector('link[rel="canonical"]');
      const ogTitle = document.querySelector('meta[property="og:title"]');
      const ogDescription = document.querySelector('meta[property="og:description"]');
      const ogImage = document.querySelector('meta[property="og:image"]');
      const ogUrl = document.querySelector('meta[property="og:url"]');
      const twitterTitle = document.querySelector('meta[name="twitter:title"]');
      const twitterDescription = document.querySelector('meta[name="twitter:description"]');
      const twitterImage = document.querySelector('meta[name="twitter:image"]');
      const summary = document.querySelector("[data-summary-existing]");
      const category = document.querySelector("[data-article-category]");
      const secondaryTag = document.querySelector("[data-article-secondary-tag]");
      const breadcrumbCategory = document.querySelector("[data-breadcrumb-category]");
      const breadcrumbTag = document.querySelector("[data-breadcrumb-tag]");
      const image = document.querySelector("[data-article-image]");
      const caption = document.querySelector("[data-article-image-caption]");
      const sourceBlock = document.querySelector('[data-text-role="source"]');
      const sourceLink = sourceBlock?.querySelector("a");
      const published = document.querySelector("[data-article-published-date]");
      const updated = document.querySelector("[data-article-updated-date]");
      const tags = document.querySelector("[data-article-tags]");
      const reactions = document.querySelector(".reactions--continued");
      const relatedList = document.querySelector(".related-list");
      const videoBlock = document.querySelector('[data-block-type="video"]');
      const gifBlock = document.querySelector('[data-block-type="gif"]');
      const requestedId = new URLSearchParams(location.search).get("id");
      const siteBaseUrl = "https://tkd197557-arch.github.io/foot-vox/";
      const formatDate = (value) => {
        const [year, month, day] = String(value || "").split("-").map(Number);
        return year && month && day ? `${year}年${month}月${day}日` : "";
      };
      const dateValue = (value) => Date.parse(`${value || ""}T00:00:00Z`) || 0;
      const articleHref = (id) => `article.html?id=${encodeURIComponent(id)}`;
      const selectRelatedArticles = (articles, current) => {
        const currentTags = new Set(current.tags || []);
        const candidates = articles
          .filter((article) => article.articleId !== current.articleId && article.relatedEligible !== false)
          .map((article) => ({
            ...article,
            commonTagCount: (article.tags || []).filter((tag) => currentTags.has(tag)).length
          }));
        const related = candidates
          .filter((article) => article.commonTagCount > 0)
          .sort((left, right) => (
            right.commonTagCount - left.commonTagCount
            || dateValue(right.updatedDate) - dateValue(left.updatedDate)
            || left.articleId.localeCompare(right.articleId)
          ))
          .slice(0, 3);
        if (related.length < 3) {
          const selected = new Set(related.map((article) => article.articleId));
          related.push(...candidates
            .filter((article) => !selected.has(article.articleId))
            .sort((left, right) => (
              dateValue(right.updatedDate) - dateValue(left.updatedDate)
              || left.articleId.localeCompare(right.articleId)
            ))
            .slice(0, 3 - related.length));
        }
        return related;
      };
      const fillSidebar = (sidebar, articles) => {
        const ids = new Set(articles.map((article) => article.articleId));
        document.querySelectorAll('[data-sidebar-list="recent-articles"] [data-sidebar-item]')
          .forEach((item, index) => {
            const data = sidebar.recentArticles[index];
            const link = item.querySelector("a");
            const thumbnail = item.querySelector("img");
            if (!data) return;
            item.dataset.articleId = data.articleId || "";
            link.href = ids.has(data.articleId) ? articleHref(data.articleId) : data.href;
            thumbnail.src = data.thumbnail;
            item.querySelector("span").textContent = data.title;
          });
        document.querySelectorAll('[data-sidebar-list="popular-articles"] [data-sidebar-item]')
          .forEach((item, index) => {
            const data = sidebar.popularArticles[index];
            if (!data) return;
            item.dataset.articleId = data.articleId || "";
            item.dataset.rank = data.rank;
            const link = item.querySelector("a");
            link.href = ids.has(data.articleId) ? articleHref(data.articleId) : data.href || "article.html";
            link.textContent = data.title;
          });
        document.querySelectorAll('[data-taxonomy-type="category"]').forEach((item, index) => {
          const data = sidebar.taxonomy.categories[index];
          if (!data) return;
          item.dataset.taxonomyId = data.taxonomyId;
          item.querySelector('[data-taxonomy-field="label"]').textContent = data.label;
          item.querySelector('[data-taxonomy-field="count"]').textContent = data.count;
        });
        document.querySelectorAll("[data-kana-group]").forEach((group, index) => {
          const data = sidebar.taxonomy.playerGroups[index];
          if (!data) return;
          group.dataset.kanaGroup = data.kana;
          group.dataset.expanded = String(data.expanded);
          group.querySelector('[data-sidebar-field="group-label"]').textContent = data.label;
          group.querySelectorAll('[data-taxonomy-type="player"]').forEach((item, playerIndex) => {
            const player = data.players[playerIndex];
            if (!player) return;
            item.dataset.taxonomyId = player.taxonomyId;
            item.querySelector('[data-taxonomy-field="label"]').textContent = player.label;
            item.querySelector('[data-taxonomy-field="count"]').textContent = player.count;
          });
        });
      };
      window.FOOT_VOX = window.FOOT_VOX || {};
      const context = { ready: null, loadStatus: "loading", articleData: null, relatedArticles: [] };
      window.FOOT_VOX.articleContext = context;
      context.ready = fetch("data/articles.json")
        .then((response) => {
          if (!response.ok) throw new Error(`Article data request failed: ${response.status}`);
          return response.json();
        })
        .then((payload) => {
          const articles = payload.articles;
          const requestedArticle = requestedId
            ? articles.find((item) => item.articleId === requestedId)
            : null;
          const article = requestedArticle
            || articles.find((item) => item.listOnHome !== false);
          if (!article) throw new Error("Article not found");
          const tag = (article.tags || []).find(
            (item) => item !== article.category && item !== "海外の反応"
          ) || article.tags?.[0] || "";
          detail.dataset.articleId = article.articleId;
          title.textContent = article.title;
          document.title = `${article.title}｜FOOT VOX`;
          metaDescription.content = article.description;
          const canonicalUrl = new URL(
            `article.html?id=${encodeURIComponent(article.articleId)}`,
            siteBaseUrl
          ).href;
          const socialImageUrl = new URL(article.image.src, siteBaseUrl).href;
          const isIndexable = Boolean(requestedArticle) && article.indexable !== false;

          metaRobots.content = isIndexable ? "index, follow" : "noindex, follow";
          if (requestedArticle) {
            canonical.href = canonicalUrl;
          } else {
            canonical.removeAttribute("href");
          }
          ogTitle.content = article.title;
          ogDescription.content = article.description;
          ogImage.content = socialImageUrl;
          ogUrl.content = requestedArticle ? canonicalUrl : "";
          twitterTitle.content = article.title;
          twitterDescription.content = article.description;
          twitterImage.content = socialImageUrl;
          summary.textContent = article.description;
          category.textContent = article.category;
          secondaryTag.textContent = tag;
          breadcrumbCategory.textContent = article.category;
          breadcrumbTag.textContent = tag;
          image.src = article.image.src;
          image.alt = article.image.alt;
          caption.textContent = article.image.caption;
          published.textContent = `公開日：${formatDate(article.publishedDate)}`;
          updated.textContent = `更新日：${formatDate(article.updatedDate)}`;
          tags.textContent = `タグ：${article.tags.join("／")}`;
          const source = (article.contentBlocks || []).find(
            (block) => block.type === "text" && block.role === "source"
          );
          sourceBlock.hidden = !source;
          if (source) {
            sourceLink.textContent = source.text;
            sourceLink.href = source.href;
          }
          const video = (article.contentBlocks || []).find((block) => block.type === "video");
          const gif = (article.contentBlocks || []).find((block) => block.type === "gif");
          videoBlock.hidden = !video?.embedUrl;
          gifBlock.hidden = !gif?.src;
          reactions.replaceChildren(...article.reactions.map((reaction) => {
            const paragraph = document.createElement("p");
            const meta = document.createElement("span");
            paragraph.className = "reaction";
            paragraph.id = `reaction-${reaction.number}`;
            meta.className = "reaction__meta";
            meta.textContent = reaction.name;
            paragraph.append(meta, document.createTextNode(reaction.text));
            return paragraph;
          }));
          const related = selectRelatedArticles(articles, article);
          relatedList.replaceChildren(...related.map((item) => {
            const li = document.createElement("li");
            const link = document.createElement("a");
            li.dataset.articleId = item.articleId;
            link.href = articleHref(item.articleId);
            link.textContent = item.title;
            li.append(link);
            return li;
          }));
          fillSidebar(payload.homeSidebar, articles);
          context.articleData = article;
          context.relatedArticles = related;
          context.loadStatus = "loaded";
          if (location.hash === "#reaction-9") {
            requestAnimationFrame(() => document.querySelector("#reaction-9")?.scrollIntoView());
          }
          return article;
        })
        .catch((error) => {
          context.loadStatus = "error";
          context.error = error.message;
          throw error;
        });
    })();
  </script>
</body>
